[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "optirank"
version = "0.1.0"
description = "OptiRank: SLA-aware two-stage ad ranking cascade with ONNX/INT8 inference engineering"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
